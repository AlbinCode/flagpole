name: Deploy to Azure

# Started by hand, with the image tag to deploy. Signs in to Azure with
# OpenID Connect, so there is no long-lived Azure password stored in GitHub.
#
# Needs these repository secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, FLAGPOLE_DB_PASSWORD, FLAGPOLE_ADMIN_KEY,
# FLAGPOLE_READER_KEY. And the variable AZURE_RESOURCE_GROUP.

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag to deploy (a commit SHA from the CI run)
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview changes
        env:
          FLAGPOLE_IMAGE: ghcr.io/albincode/flagpole:${{ inputs.image-tag }}
          FLAGPOLE_DB_PASSWORD: ${{ secrets.FLAGPOLE_DB_PASSWORD }}
          FLAGPOLE_ADMIN_KEY: ${{ secrets.FLAGPOLE_ADMIN_KEY }}
          FLAGPOLE_READER_KEY: ${{ secrets.FLAGPOLE_READER_KEY }}
        run: >
          az deployment group what-if
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --parameters infra/main.bicepparam

      - name: Deploy
        env:
          FLAGPOLE_IMAGE: ghcr.io/albincode/flagpole:${{ inputs.image-tag }}
          FLAGPOLE_DB_PASSWORD: ${{ secrets.FLAGPOLE_DB_PASSWORD }}
          FLAGPOLE_ADMIN_KEY: ${{ secrets.FLAGPOLE_ADMIN_KEY }}
          FLAGPOLE_READER_KEY: ${{ secrets.FLAGPOLE_READER_KEY }}
        run: >
          az deployment group create
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --parameters infra/main.bicepparam
          --query properties.outputs.appUrl.value
          --output tsv
