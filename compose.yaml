# Local development: API + PostgreSQL. Start with `docker compose up --build`.
# The keys and password below are for local use only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flagpole
      POSTGRES_USER: flagpole
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagpole -d flagpole"]
      interval: 5s
      retries: 10
    volumes:
      - flagpole-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Flagpole: Host=db;Port=5432;Database=flagpole;Username=flagpole;Password=local-dev-only
    ports:
      - "8080:8080"

volumes:
  flagpole-data:
